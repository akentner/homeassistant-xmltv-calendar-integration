[project]
name = "homeassistant-xmltv-calendar-integration"
version = "0.0.0"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "benchmark: generates a 60 MB feed; slow",
]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.372",
    "ruff==0.17.1",
]
